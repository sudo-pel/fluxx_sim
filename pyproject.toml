[project]
name = "fluxx-rl"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "pettingzoo>=1.24",
    "numpy>=1.24,<2.2",
    "tensorboard>=2.15",
    "sentence-transformers>=2.7",
]
[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]